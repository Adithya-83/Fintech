name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install FastAPI & Motor Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Syntax & Bytecode Compilation Check
        run: |
          python -m py_compile backend/config.py backend/database.py backend/auth.py backend/models.py backend/main.py backend/routes/*.py

      - name: Run Automated Pytest Suite
        run: |
          pytest backend/tests -v

  frontend-ci:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build React Dashboard (Vite)
        run: npm run build

      - name: Upload Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vite-dist-build
          path: dist/
          retention-days: 7
